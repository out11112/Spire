[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spire-server"
version = "0.1.0"
description = "Standalone cooperative card-climbing game server with LinkChat account authentication"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
spire-server = "spire_server.main:run"

[tool.setuptools.packages.find]
include = ["spire_server*", "linkchat_spire*"]

[tool.setuptools.package-data]
"linkchat_spire.content.data" = [
    "official_descriptions.json",
    "official_event_options.json",
    "official_power_descriptions.json",
    "official_power_names.json",
    "ascension_monsters.json",
    "intent_types.json",
    "potion_data.json",
    "relic_data.json",
    "splash_pool.json",
    "transformation_pool.json",
    "world_data.json",
]
